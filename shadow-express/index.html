<title>Shadow Express</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Alegreya+Sans+SC:wght@500;700&display=swap">
<style>
/* Layout: a night globe fills the screen; a paper ledger slides over it (from the bottom on phones,
   from the right on wide screens); a brass date dial rides the top left. One deliberate look in
   both host themes: night ground, paper panels. */
:root {
  color-scheme: dark;
  --night: #0e1522;
  --night-2: #1a2436;
  --sea: #1d3a48;
  --sea-hi: #2c5465;
  --land: #d6c49a;
  --land-edge: #8c774b;
  --paper: #f3ebd8;
  --paper-2: #e7dbbf;
  --paper-3: #d9c9a5;
  --ink: #1c2130;
  --ink-soft: #545462;
  --brass: #ad8642;
  --brass-hi: #dcb66c;
  --oxblood: #8f2f29;
  --oxblood-hi: #c4544a;
  --steam: #a9cbd5;
  --good: #3c6a49;
  --font-display: "Cormorant Garamond", Garamond, "Times New Roman", serif;
  --font-body: "Alegreya", Georgia, "Times New Roman", serif;
  --font-label: "Alegreya Sans SC", "Gill Sans", "Trebuchet MS", sans-serif;
  --ledger-w: 400px;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; background: radial-gradient(120% 90% at 50% 40%, var(--night-2), var(--night) 70%); color: var(--paper); font-family: var(--font-body); font-size: 16px; overflow: hidden; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--brass-hi); outline-offset: 2px; }
#app { position: relative; height: 100%; width: 100%; overflow: hidden; touch-action: none; }
#globe { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
#globe.dragging { cursor: grabbing; }

/* ---- top bar */
.hud { position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: flex-start; gap: 12px; padding: 12px 16px 0; pointer-events: none; }
.hud > * { pointer-events: auto; }
.dial { position: relative; width: 104px; height: 104px; flex: none; border: 0; padding: 0; background: none; }
.dial svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 4px 10px rgba(0,0,0,.45)); }
.dial .day { font-family: var(--font-display); font-weight: 700; }
.mission { flex: 1 1 auto; min-width: 0; max-width: 460px; margin-top: 10px; background: var(--paper); color: var(--ink); border: 1px solid var(--paper-3); border-radius: 3px; padding: 8px 12px 9px; box-shadow: 0 6px 18px rgba(0,0,0,.35); text-align: left; }
.mission .k { font-family: var(--font-label); font-size: 12px; letter-spacing: .08em; color: var(--brass); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mission .what { font-family: var(--font-display); font-size: 19px; font-weight: 600; line-height: 1.15; margin-top: 1px; text-wrap: balance; }
.mission .when { font-size: 14px; color: var(--ink-soft); margin-top: 2px; font-variant-numeric: tabular-nums; }
.mission .when b { color: var(--ink); font-weight: 700; }
.mission.urgent .when b { color: var(--oxblood); }
.purse { margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; margin-top: 10px; }
.coin { display: flex; align-items: baseline; gap: 6px; background: var(--paper); color: var(--ink); border: 1px solid var(--paper-3); border-radius: 3px; padding: 5px 10px; box-shadow: 0 6px 18px rgba(0,0,0,.35); font-variant-numeric: tabular-nums; }
.coin .l { font-family: var(--font-label); font-size: 12px; color: var(--brass); letter-spacing: .08em; }
.coin .v { font-family: var(--font-display); font-size: 22px; font-weight: 700; }
.nerve { width: 100%; height: 5px; background: var(--paper-3); border-radius: 3px; overflow: hidden; margin-top: 3px; }
.nerve i { display: block; height: 100%; background: var(--good); }
.nerve.low i { background: var(--oxblood); }
.chips { display: flex; gap: 6px; }
.chip { background: rgba(14,21,34,.72); border: 1px solid rgba(220,182,108,.45); color: var(--paper); border-radius: 999px; padding: 4px 11px; font-family: var(--font-label); font-size: 13px; letter-spacing: .06em; }
.chip:hover { border-color: var(--brass-hi); }

/* ---- ledger (city, departures, market …) */
.ledger { position: absolute; z-index: 5; background: var(--paper); color: var(--ink); box-shadow: 0 -10px 40px rgba(0,0,0,.45); display: flex; flex-direction: column; transition: transform .35s cubic-bezier(.2,.8,.2,1); }
.ledger[data-open="false"] { transform: translateY(calc(100% - 64px)); }
.ledger[data-open="gone"] { transform: translateY(110%); }
@media (min-width: 900px) {
  .ledger { top: 0; right: 0; bottom: 0; width: var(--ledger-w); box-shadow: -10px 0 40px rgba(0,0,0,.45); }
  .ledger[data-open="false"], .ledger[data-open="gone"] { transform: translateX(110%); }
  .hud { right: var(--ledger-w); }
  .journeybar { right: calc(var(--ledger-w) + 16px) !important; }
}
@media (max-width: 899px) {
  .ledger { left: 0; right: 0; bottom: 0; max-height: 56%; border-radius: 10px 10px 0 0; }
  .scene { height: 84px; }
  .scene .title .n { font-size: 27px; }
  .chips { display: none; }
}
.ledger .grip { display: none; }
@media (max-width: 899px) { .ledger .grip { display: block; width: 44px; height: 4px; border-radius: 3px; background: var(--paper-3); margin: 8px auto 0; flex: none; border: 0; padding: 0; } }
.scene { position: relative; height: 128px; flex: none; overflow: hidden; }
.scene svg { width: 100%; height: 100%; display: block; }
.scene .title { position: absolute; left: 18px; right: 18px; bottom: 10px; color: var(--paper); text-shadow: 0 2px 8px rgba(0,0,0,.6); }
.scene .title .n { font-family: var(--font-display); font-weight: 700; font-size: 36px; line-height: 1; letter-spacing: .01em; }
.scene .title .c { font-family: var(--font-label); font-size: 12.5px; letter-spacing: .1em; opacity: .9; }
.body { min-height: 0; overflow-y: auto; padding: 14px 18px 18px; display: flex; flex-direction: column; gap: 12px; }
.lede { font-style: italic; color: var(--ink-soft); font-size: 15.5px; line-height: 1.45; margin: 0; }
.sec { font-family: var(--font-label); font-size: 12.5px; letter-spacing: .1em; color: var(--brass); margin: 6px 0 -4px; display: flex; align-items: center; gap: 8px; }
.sec::after { content: ""; flex: 1; height: 1px; background: var(--paper-3); }
.acts { display: flex; flex-direction: column; border-top: 1px solid var(--paper-3); }
.act { display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 10px; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--paper-3); padding: 10px 2px; }
.act:hover:not(:disabled) { background: var(--paper-2); }
.act:disabled { opacity: .45; cursor: default; }
.act .ic { width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--brass); display: grid; place-items: center; color: var(--brass); }
.act .ic svg { width: 17px; height: 17px; }
.act .t { font-family: var(--font-display); font-weight: 700; font-size: 19px; line-height: 1.1; }
.act .s { font-size: 13.5px; color: var(--ink-soft); line-height: 1.3; }
.act .r { font-variant-numeric: tabular-nums; font-size: 14px; color: var(--ink-soft); text-align: right; white-space: nowrap; }
.act.key { background: var(--ink); color: var(--paper); border-radius: 3px; border: 0; padding: 12px 10px; margin-bottom: 4px; }
.act.key .ic { border-color: var(--brass-hi); color: var(--brass-hi); }
.act.key .s { color: var(--paper-3); }
.act.key:hover { background: #2a3145; }
.dep { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 10px 2px; border-bottom: 1px solid var(--paper-3); }
.dep .to { font-family: var(--font-display); font-weight: 700; font-size: 20px; line-height: 1.1; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.dep .to .mode { font-family: var(--font-label); font-size: 11.5px; letter-spacing: .08em; color: var(--brass); }
.dep .via { font-size: 13.5px; color: var(--ink-soft); }
.dep .times { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.slot { border: 1px solid var(--brass); background: var(--paper); border-radius: 3px; padding: 5px 9px; font-variant-numeric: tabular-nums; font-size: 14px; text-align: left; line-height: 1.25; }
.slot b { font-family: var(--font-display); font-size: 17px; }
.slot .a { display: block; color: var(--ink-soft); font-size: 12.5px; }
.slot:hover:not(:disabled) { background: var(--ink); color: var(--paper); }
.slot:hover:not(:disabled) .a { color: var(--paper-3); }
.slot:disabled { opacity: .45; cursor: default; }
.slot.late { border-color: var(--oxblood); }
.tag { display: inline-block; font-family: var(--font-label); font-size: 11px; letter-spacing: .07em; padding: 1px 6px; border-radius: 2px; background: var(--paper-2); color: var(--ink-soft); }
.tag.warn { background: var(--oxblood); color: var(--paper); }
.fare { font-family: var(--font-display); font-weight: 700; font-size: 20px; font-variant-numeric: tabular-nums; }
.note { font-size: 14px; color: var(--ink-soft); line-height: 1.4; margin: 0; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 1px solid var(--ink); background: var(--ink); color: var(--paper); border-radius: 3px; padding: 8px 14px; font-family: var(--font-label); letter-spacing: .07em; font-size: 14px; }
.btn.ghost { background: transparent; color: var(--ink); }
.btn:disabled { opacity: .4; cursor: default; }
.back { align-self: flex-start; border: 0; background: none; color: var(--brass); font-family: var(--font-label); letter-spacing: .08em; font-size: 13px; padding: 0; }
.cluelist { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.cluelist li { font-size: 14.5px; line-height: 1.4; padding-left: 14px; position: relative; }
.cluelist li::before { content: ""; position: absolute; left: 0; top: .55em; width: 7px; height: 7px; border-radius: 50%; background: var(--oxblood); }
.cluelist li.mine::before { background: var(--brass); }
.cluelist .age { color: var(--ink-soft); font-size: 13px; }

/* ---- journey bar */
.journeybar { position: absolute; left: 16px; right: 16px; bottom: 16px; z-index: 4; background: var(--paper); color: var(--ink); border-radius: 4px; padding: 10px 14px 12px; box-shadow: 0 10px 30px rgba(0,0,0,.45); display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; max-width: 640px; margin: 0 auto; }
.journeybar .rt { font-family: var(--font-display); font-weight: 700; font-size: 19px; line-height: 1.15; min-width: 0; }
.journeybar .sub { font-size: 13.5px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.journeybar .bar { grid-column: 1 / -1; height: 6px; background: var(--paper-3); border-radius: 3px; overflow: hidden; }
.journeybar .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--brass), var(--brass-hi)); }
.journeybar .speed { align-self: center; }

/* ---- story cards */
.veil { position: absolute; inset: 0; z-index: 10; background: rgba(8,12,20,.55); display: grid; place-items: center; padding: 16px; }
.card { width: min(520px, 100%); max-height: calc(100% - 32px); overflow-y: auto; background: var(--paper); color: var(--ink); border-radius: 4px; box-shadow: 0 20px 60px rgba(0,0,0,.6); padding: 22px 22px 18px; position: relative; }
.card::before { content: ""; position: absolute; inset: 7px; border: 1px solid var(--paper-3); border-radius: 2px; pointer-events: none; }
.card .kick { font-family: var(--font-label); font-size: 12.5px; letter-spacing: .12em; color: var(--brass); }
.card.danger .kick { color: var(--oxblood); }
.card h2 { font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1.05; margin: 4px 0 10px; text-wrap: balance; }
.card p { font-size: 16.5px; line-height: 1.5; margin: 0 0 10px; }
.card .choices { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; position: relative; }
.choice { text-align: left; border: 1px solid var(--ink); background: var(--paper); border-radius: 3px; padding: 9px 12px; }
.choice b { font-family: var(--font-display); font-size: 18.5px; display: block; line-height: 1.15; }
.choice span { font-size: 13.5px; color: var(--ink-soft); }
.choice:hover:not(:disabled) { background: var(--ink); color: var(--paper); }
.choice:hover:not(:disabled) span { color: var(--paper-3); }
.choice:disabled { opacity: .4; cursor: default; }
.card .result { border-top: 1px solid var(--paper-3); padding-top: 10px; margin-top: 10px; font-style: italic; }
.card .stamp { font-family: var(--font-label); letter-spacing: .1em; font-size: 12px; color: var(--ink-soft); }
.title-card h1 { font-family: var(--font-display); font-weight: 700; font-size: 54px; line-height: .95; margin: 2px 0 6px; letter-spacing: .01em; }
.title-card .rule { height: 1px; background: var(--brass); margin: 10px 0 12px; position: relative; }
.title-card .rule::after { content: ""; position: absolute; left: 50%; top: -4px; width: 8px; height: 8px; background: var(--brass); transform: translateX(-50%) rotate(45deg); }

/* ---- toast */
.toasts { position: absolute; left: 50%; transform: translateX(-50%); top: 128px; z-index: 8; display: flex; flex-direction: column; gap: 6px; width: min(460px, calc(100% - 32px)); pointer-events: none; }
.toast { background: rgba(14,21,34,.88); color: var(--paper); border: 1px solid rgba(220,182,108,.5); border-radius: 3px; padding: 8px 12px; font-size: 14.5px; line-height: 1.35; animation: tin .35s ease-out; }
.toast.bad { border-color: var(--oxblood-hi); }
@keyframes tin { from { opacity: 0; transform: translateY(-6px); } }
@media (min-width: 900px) { .toasts { left: calc(50% - var(--ledger-w) / 2); } }
@media (max-width: 520px) {
  .hud { gap: 10px; }
  .dial { width: 70px; height: 70px; }
  .mission { margin-top: 4px; padding: 6px 10px 7px; }
  .mission .what { font-size: 16px; }
  .mission .when { font-size: 12.5px; }
  .purse { margin-top: 4px; }
  .coin .v { font-size: 19px; }
  .toasts { top: 96px; }
  .title-card h1 { font-size: 44px; }
}
@media (prefers-reduced-motion: reduce) { .ledger { transition: none; } .toast { animation: none; } }
</style>

<div id="app">
  <canvas id="globe" aria-label="Map of Europe. Drag to turn the globe; tap a city."></canvas>
  <div class="hud">
    <button class="dial" id="dial" aria-label="Date and time; open the dossier"></button>
    <button class="mission" id="mission" aria-label="Current mission"></button>
    <div class="purse">
      <div class="coin" title="Money and nerve"><span class="l">£</span><span class="v" id="money">60</span><div style="width:46px"><div class="nerve" id="nerve"><i></i></div></div></div>
      <div class="chips"><button class="chip" id="caseBtn">Case</button><button class="chip" id="dossierBtn">Dossier</button></div>
    </div>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="journeybar" id="journeybar" hidden>
    <div class="rt" id="jbRoute"></div>
    <button class="chip speed" id="speedBtn" aria-label="Change travel speed">» faster</button>
    <div class="sub" id="jbSub"></div>
    <div class="bar"><i id="jbBar"></i></div>
  </div>
  <section class="ledger" id="ledger" data-open="false" aria-label="City ledger">
    <button class="grip" id="grip" aria-label="Open or close the ledger"></button>
    <div class="scene" id="scene"></div>
    <div class="body" id="ledgerBody"></div>
  </section>
  <div class="veil" id="veil" hidden><div class="card" id="card" role="dialog" aria-modal="true"></div></div>
</div>

const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const MDAYS = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
function dateOf(t) {
  t = Math.floor(t);
  const d = Math.floor(t / 1440), m = ((t % 1440) + 1440) % 1440;
  let day = 4 + d, month = 4;
  while (day > MDAYS[month]) { day -= MDAYS[month]; month++; }
  return { dow: (1 + d) % 7, day, month, hh: Math.floor(m / 60), mm: m % 60, d, doy: 120 + d + 4 };
}
const pad = (n) => String(n).padStart(2, '0');
const hm = (t) => { const x = dateOf(t); return `${pad(x.hh)}.${pad(x.mm)}`; };
const dayShort = (t) => { const x = dateOf(t); return `${DAYS[x.dow].slice(0, 3)} ${x.day} ${MONTHS[x.month].slice(0, 3)}`; };
const when = (t) => `${dayShort(t)} ${hm(t)}`;
const span = (min) => { min = Math.max(0, Math.round(min)); const d = Math.floor(min / 1440), h = Math.floor((min % 1440) / 60), m = min % 60; return d ? `${d}d ${h}h` : h ? `${h}h ${pad(m)}m` : `${m}m`; };

// =============================================================== new game

function journeyEvent() {
  const j = S.journey, r = ROUTES[j.r];
  const pool = EVENTS.filter((e) => e.ok(j, r) && !(j.used || []).includes(e.id));
  if (!pool.length) return;
  const e = pick(pool);
  j.used = [...(j.used || []), e.id];
  showCard({ kick: `${r.name} · ${hm(S.t)}`, title: CITY[j.from].name + ' to ' + CITY[j.to].name, body: [e.text(j)], choices: e.choices() });
}

// =============================================================== city doings
function deliver() {
  const m = S.mission;
  if (m.phase === 'collect') {
    m.phase = 'deliver';
    trace(S.city, 'meeting', 0.3);
    showCard({ kick: CITY[S.city].name, title: 'The handover', body: [`A bookseller wraps ${m.cargo} in yesterday's newspaper without a word. Now it must reach ${CITY[m.dest].name} by ${when(m.deadline)}.`], choices: [{ label: 'Pocket it', run: () => null }] });
  } else {
    S.money += m.reward; S.done++;
    S.history.push({ ok: true, text: `${cap(m.cargo)} to ${CITY[m.dest].name}`, t: S.t });
    trace(S.city, 'meeting', 0.3);
    if (S.leak === m.dest) S.leak = null;
    S.mission = null;
    if (S.done >= 5) { save(); showCard({ kick: CITY[S.city].name, title: 'Delivered', body: [`Our man takes ${m.cargo} and pays £${m.reward}.`], choices: [{ label: 'Wire London', run: () => { setTimeout(() => endGame('won'), 0); return null; } }] }); return; }
    const next = makeMission(false);
    const joins = HUNTERS.find((h) => h.after === S.done);
    showCard({ kick: CITY[S.city].name, title: 'Delivered', body: [`Our man takes ${m.cargo} without counting the stitches, and pays £${m.reward} in gold.`, joins ? `He adds, quietly: ${joins.name} of ${joins.of} has been asking after you. There are three of them now.` : 'Before you have finished your coffee, a new order arrives.'], choices: [{ label: 'Read the new order', run: () => { S.mission = next; return null; } }] });
  }
  save(); render();
}
function rest() {
  const cost = hotelCost();

  S.money -= cost;
  trace(S.city, 'hotel', 0.85);
  const until = S.t + 8 * 60;
  ledger.dataset.open = 'gone';
  S.resting = until;
  render();
}
const hotelCost = () => ({ LON: 4, PAR: 4, BER: 3, VIE: 3, SPB: 4, IST: 3 }[S.city] ?? 2);

function wire(kind, arg) {
  if (kind === 'news') {
    if (S.money < 4) return;
    S.money -= 4;
    trace(S.city, 'telegram', 0.55);
    const lines = [];
    for (const h of S.hunters.filter((x) => x.active)) {
      const w = hunterWhere(h, S.t - 180);
      if (w.city) { addClue({ hid: h.id, city: w.city, t: S.t - 180, src: 'Bureau report' }); lines.push(`${HDEF[h.id].name}: seen in ${CITY[w.city].name} three hours ago.`); }
      else { addClue({ hid: h.id, city: w.between, t: S.t - 180, src: `Bureau report: left for ${CITY[w.toward]?.name ?? 'parts unknown'}` }); lines.push(`${HDEF[h.id].name}: left ${CITY[w.between].name}, travelling toward ${CITY[w.toward]?.name ?? 'parts unknown'}.`); }
    }
    passTime(45);
    showCard({ kick: `Telegraph office · ${CITY[S.city].name}`, title: 'The Bureau replies', body: lines.length ? lines : ['Nothing to report.'], choices: [{ label: 'Burn the form', run: () => null }] });
  } else if (kind === 'false') {
    if (S.money < 6) return;
    S.money -= 6;
    S.traces.push({ city: arg, t: S.t, kind: 'false trail', known: S.t + between(120, 300) });
    trace(S.city, 'telegram', 0.35);
    passTime(45);
    showCard({ kick: `Telegraph office · ${CITY[S.city].name}`, title: 'A false trail', body: [`You wire a hotel in ${CITY[arg].name} to hold a room in your own name, and a cousin there to be seen collecting your post.`], choices: [{ label: 'Leave quietly', run: () => null }] });
  } else if (kind === 'funds') {
    S.money += 20; S.fundsAt = S.t;
    trace(S.city, 'telegram', 0.8);
    passTime(60);
    showCard({ kick: `Telegraph office · ${CITY[S.city].name}`, title: 'Funds wired', body: ['Twenty pounds arrive by return, with a curt note about expenses.'], choices: [{ label: 'Count it twice', run: () => null }] });
  }
  render();
}
function buy(k) { const it = ITEMS[k]; const p = price(k); if (S.money < p) return; S.money -= p; if (k === 'disguise') { S.disguiseUntil = Math.max(S.t, S.disguiseUntil) + 48 * 60; } else S.items[k] = (S.items[k] || 0) + 1; trace(S.city, 'shop', 0.1); toast(`Bought: ${it.name}.`); render(); }
function sell(k) { const p = Math.floor(price(k) / 2); S.items[k]--; if (!S.items[k]) delete S.items[k]; S.money += p; toast(`Sold for £${p}.`); render(); }
const price = (k) => Math.round(ITEMS[k].price * ({ LON: 1.2, PAR: 1.15, IST: 0.8, ODE: 0.85, BAR: 0.9, MAR: 0.9 }[S.city] ?? 1));
function useBrandy() { if (!S.items.brandy) return; S.items.brandy--; if (!S.items.brandy) delete S.items.brandy; S.nerve = clamp(S.nerve + 15, 0, 100); toast('The brandy steadies you.'); render(); }

// =============================================================== ending
function endGame(kind, h) {
  S.ended = kind;
  S.wait = null; S.journey = null; paused = true;
  store.del('shadow-express');
  const days = (S.t - 8 * 60) / 1440;
  const stats = `${S.done} missions done, ${S.failed} failed · ${S.km.toLocaleString('en-GB')} km in ${days.toFixed(1)} days · £${S.money} in hand`;
  const T = {
    won: { kick: 'The Bureau', title: 'Five for five', body: ['London sends a single word, which is more than it has ever sent anyone: "Splendid."', stats] },
    dismissed: { kick: 'The Bureau', title: 'Dismissed', body: ['Three orders missed. Your rooms are let to someone else, your name struck from a list that does not exist.', stats] },
    captured: { kick: 'Taken', title: `${HDEF[h?.id]?.name ?? 'They'} wins`, body: ['There is no consular clerk this time. Your war, if there is to be a war, will be spent in a fortress.', stats] },
  }[kind];
  showCard({ kick: T.kick, danger: kind !== 'won', title: T.title, body: T.body, choices: [{ label: 'Begin again', run: () => { startFresh(); return null; } }], end: true });
}

// =============================================================== saving
function save() { if (!S || S.ended) return; store.set('shadow-express', JSON.stringify(S)); }

// =============================================================== globe drawing
const canvas = $('#globe');
const ctx = canvas.getContext('2d');
const proj = d3.geoOrthographic().clipAngle(90).precision(0.6);
const path = d3.geoPath(proj, ctx);
const graticule = d3.geoGraticule10();
const sphere = { type: 'Sphere' };
const LANDGEO = LAND ? { type: 'Feature', geometry: LAND } : null;
const LANDLO = LAND_LO ? { type: 'Feature', geometry: LAND_LO } : LANDGEO;
const view = { lon: 8, lat: 47, zoom: 1.5, follow: true, tLon: 8, tLat: 47, tZoom: 1.5 };
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = canvas.clientWidth; H = canvas.clientHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  render();
}
function frameGeom() {
  const wide = W >= 900 && ledgerOpen();
  const cx = wide ? (W - 400) / 2 : W / 2;
  const phone = W < 900;
  const cy = phone ? (ledgerOpen() ? H * 0.28 : H * 0.52) : H * 0.54;
  const base = Math.min(wide ? W - 400 : W, H) * 0.46;
  return { cx, cy, R: base * view.zoom };
}
function sunPoint(t) {
  const x = dateOf(t);
  const decl = -23.44 * Math.cos((2 * Math.PI / 365) * (x.doy + 10));
  const lon = -((x.hh + x.mm / 60) - 12) * 15;
  return [lon, decl];
}
function playerLL() {
  if (S?.journey) {
    const j = S.journey;
    const f = clamp((S.t - j.dep) / (j.arr - j.dep), 0, 1);
    return d3.geoInterpolate(CITY[j.from].ll, CITY[j.to].ll)(f);
  }
  return S ? CITY[S.city].ll : [8, 47];
}
function visible(ll) { return d3.geoDistance(ll, [view.lon, view.lat]) < Math.PI / 2 - 0.02; }
const baseCv = document.createElement('canvas');
const bctx = baseCv.getContext('2d');
const bpath = d3.geoPath(proj, bctx);
let baseKey = '';
function drawBase(cx, cy, R) {
  const key = [W, H, DPR, view.lon.toFixed(2), view.lat.toFixed(2), view.zoom.toFixed(3)].join('|');
  if (key === baseKey) return;
  baseKey = key;
  if (baseCv.width !== canvas.width || baseCv.height !== canvas.height) { baseCv.width = canvas.width; baseCv.height = canvas.height; }
  const c = bctx;
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  c.clearRect(0, 0, W, H);
  const halo = c.createRadialGradient(cx, cy, R * 0.95, cx, cy, R * 1.18);
  halo.addColorStop(0, 'rgba(169,203,213,0.18)'); halo.addColorStop(1, 'rgba(169,203,213,0)');
  c.fillStyle = halo; c.beginPath(); c.arc(cx, cy, R * 1.18, 0, 2 * Math.PI); c.fill();
  const sea = c.createRadialGradient(cx - R * 0.3, cy - R * 0.35, R * 0.1, cx, cy, R);
  sea.addColorStop(0, css('--sea-hi')); sea.addColorStop(1, css('--sea'));
  c.beginPath(); bpath(sphere); c.fillStyle = sea; c.fill();
  c.beginPath(); bpath(graticule); c.strokeStyle = 'rgba(169,203,213,0.10)'; c.lineWidth = 0.7; c.stroke();
  const land = view.zoom >= 3 ? LANDGEO : LANDLO;
  if (land) { c.beginPath(); bpath(land); c.fillStyle = css('--land'); c.fill(); c.strokeStyle = css('--land-edge'); c.lineWidth = 0.8; c.stroke(); }
  c.beginPath(); bpath(sphere); c.strokeStyle = 'rgba(220,182,108,0.55)'; c.lineWidth = 1.2; c.stroke();
}
function draw() {
  const { cx, cy, R } = frameGeom();
  proj.scale(R).translate([cx, cy]).rotate([-view.lon, -view.lat]);
  drawBase(cx, cy, R);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(baseCv, 0, 0);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (S) { const sun = sunPoint(S.t), c = [sun[0] + 180, -sun[1]]; for (const [r, a] of [[96, 0.08], [92, 0.1], [88, 0.1], [84, 0.12]]) { ctx.beginPath(); path(d3.geoCircle().center(c).radius(r)()); ctx.fillStyle = `rgba(9,14,26,${a})`; ctx.fill(); } }
  if (!S) return;
  // all lines, faint
  for (const r of ROUTES) {
    ctx.beginPath(); path({ type: 'LineString', coordinates: [CITY[r.a].ll, CITY[r.b].ll] });
    ctx.setLineDash(r.mode === 'sea' ? [3, 4] : []);
    ctx.strokeStyle = 'rgba(60,45,25,0.28)'; ctx.lineWidth = 1; ctx.stroke();
  }
  // lines from here
  const here = S.journey ? null : (S.wait ? S.wait.from : S.city);
  if (here && !S.ended) for (const { r, to } of ADJ[here]) {
    ctx.beginPath(); path({ type: 'LineString', coordinates: [CITY[here].ll, CITY[to].ll] });
    ctx.setLineDash(r.mode === 'sea' ? [5, 5] : []);
    ctx.strokeStyle = r.mode === 'sea' ? css('--steam') : css('--brass-hi'); ctx.lineWidth = S.wait && S.wait.r !== r.i ? 1 : 2.2; ctx.globalAlpha = S.wait && S.wait.r !== r.i ? 0.35 : 0.95; ctx.stroke(); ctx.globalAlpha = 1;
  }
  ctx.setLineDash([]);
  // journey line
  if (S.journey) {
    const j = S.journey;
    const a = CITY[j.from].ll, b = CITY[j.to].ll, f = clamp((S.t - j.dep) / (j.arr - j.dep), 0, 1);
    const mid = d3.geoInterpolate(a, b)(f);
    ctx.beginPath(); path({ type: 'LineString', coordinates: [a, b] }); ctx.strokeStyle = 'rgba(220,182,108,0.35)'; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.beginPath(); path({ type: 'LineString', coordinates: [a, mid] }); ctx.strokeStyle = css('--brass-hi'); ctx.lineWidth = 3; ctx.stroke();
  }
  // clues: last known positions of the hunters
  const latest = {};
  for (const c of S.clues) { const k = c.hid ?? `?${c.city}`; if (!latest[k] || latest[k].t < c.t) latest[k] = c; }
  for (const c of Object.values(latest)) {
    const age = S.t - c.t; if (age > 3 * 1440) continue;
    const ll = CITY[c.city].ll; if (!visible(ll)) continue;
    const [x, y] = proj(ll);
    const a = clamp(1 - age / (3 * 1440), 0.25, 1);

  const m = S.mission;
  let h = `<button class="back" data-go="city">‹ ${esc(CITY[S.city].name)}</button>`;
  if (m) h += `<div class="sec">Orders</div><p class="note"><b>${esc(cap(m.cargo))}</b>${m.phase === 'collect' ? `: collect in ${esc(CITY[m.at].name)}, then` : ''} deliver to ${esc(CITY[m.dest].name)} by ${when(m.deadline)}. Payment £${m.reward}.</p>`;
  h += `<div class="sec">Record</div><p class="note">${S.done} delivered, ${S.failed} missed of five. Three misses and London disowns you. Twice detained and you will not be released.</p>`;
  if (S.history.length) h += `<ul class="cluelist">${S.history.slice().reverse().map((x) => `<li class="${x.ok ? 'mine' : ''}">${esc(x.text)} <span class="age">${when(x.t)}</span></li>`).join('')}</ul>`;
  h += '<div class="sec">The hunters</div><ul class="cluelist">';
  for (const hs of S.hunters) {
    const d = HDEF[hs.id];
    if (!hs.active) { h += `<li>${esc(d.name)} of ${esc(d.of)}: not yet on your trail.</li>`; continue; }
    const last = S.clues.filter((c) => c.hid === hs.id).sort((a, b) => b.t - a.t)[0];
    h += `<li><b>${esc(d.name)}</b>, ${esc(d.of)}: ${esc(d.look)}. ${last ? `Last known: ${esc(CITY[last.city].name)}, <span class="age">${ago(S.t - last.t)}</span>.` : 'Whereabouts unknown.'}</li>`;
  }
  h += '</ul>';
  if (S.leak) h += `<p class="note" style="color:var(--oxblood)">They know you are bound for ${esc(CITY[S.leak].name)}.</p>`;
  body.innerHTML = h;
  body.querySelector('[data-go]').addEventListener('click', () => openLedger('city'));
}

// =============================================================== top bar
function dialSVG() {
  const x = dateOf(S.t);
  const day = Math.floor((S.t - 8 * 60) / 1440) + 1;
  const ang = ((x.hh % 12) + x.mm / 60) / 12 * 360, mang = x.mm / 60 * 360;
  let left = 1;
  if (S.mission) left = clamp((S.mission.deadline - S.t) / Math.max(60, S.mission.deadline - S.mission.issued), 0, 1);
  const R = 46, C = 2 * Math.PI * R;
  const ticks = Array.from({ length: 12 }, (_, i) => { const a = i / 12 * 2 * Math.PI; return `<line x1="${50 + Math.sin(a) * 37}" y1="${50 - Math.cos(a) * 37}" x2="${50 + Math.sin(a) * 40}" y2="${50 - Math.cos(a) * 40}"/>`; }).join('');
  const night = x.hh >= 20 || x.hh < 6;
  return `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="49" fill="${css('--night')}"/><circle cx="50" cy="50" r="${R}" fill="none" stroke="${css('--night-2')}" stroke-width="5"/>
  <circle cx="50" cy="50" r="${R}" fill="none" stroke="${left < 0.25 ? css('--oxblood-hi') : css('--brass-hi')}" stroke-width="5" stroke-dasharray="${(C * left).toFixed(1)} ${C}" transform="rotate(-90 50 50)" stroke-linecap="round"/>
  <circle cx="50" cy="50" r="41" fill="${night ? '#1d2840' : css('--paper')}" stroke="${css('--brass')}" stroke-width="1.2"/>
  <g stroke="${night ? css('--paper-3') : css('--ink-soft')}" stroke-width="1.2">${ticks}</g>
  <text x="50" y="38" text-anchor="middle" font-family="${css('--font-label')}" font-size="8.5" letter-spacing=".8" fill="${night ? css('--paper-3') : css('--ink-soft')}">DAY</text>
  <text class="day" x="50" y="60" text-anchor="middle" font-size="25" fill="${night ? css('--paper') : css('--ink')}">${day}</text>
  <text x="50" y="74" text-anchor="middle" font-family="${css('--font-body')}" font-size="10" fill="${night ? css('--paper-3') : css('--ink-soft')}">${pad(x.hh)}.${pad(x.mm)}</text>
  <line x1="50" y1="50" x2="${50 + Math.sin(ang * DEG2) * 22}" y2="${50 - Math.cos(ang * DEG2) * 22}" stroke="${css('--brass')}" stroke-width="2.2" stroke-linecap="round" opacity=".55"/>
  <line x1="50" y1="50" x2="${50 + Math.sin(mang * DEG2) * 31}" y2="${50 - Math.cos(mang * DEG2) * 31}" stroke="${css('--brass')}" stroke-width="1.2" stroke-linecap="round" opacity=".55"/>
  </svg>`;
}
let lastHud = '';
function renderHud() {
  const m = S.mission;
  const sig = `${S.t}|${S.money}|${S.nerve}|${m?.deadline}|${m?.phase}|${S.done}`;
  if (sig === lastHud) return;
  lastHud = sig;
  $('#dial').innerHTML = dialSVG();
  $('#money').textContent = S.money;
  const nv = $('#nerve'); nv.querySelector('i').style.width = `${S.nerve}%`; nv.classList.toggle('low', S.nerve < 35);
  const mb = $('#mission');
  if (m) {
    const left = m.deadline - S.t;
    mb.classList.toggle('urgent', left < 12 * 60);
    mb.innerHTML = `<div class="k">Mission ${S.done + S.failed + 1} of 5 · £${m.reward}</div><div class="what">${m.phase === 'collect' ? `Collect in ${esc(CITY[m.at].name)}, deliver to ${esc(CITY[m.dest].name)}` : `Deliver to ${esc(CITY[m.dest].name)}`}</div><div class="when">by ${when(m.deadline)} · <b>${span(left)}</b> left</div>`;
    mb.hidden = false;
  } else mb.hidden = true;
}
function renderJourneyBar() {
  const jb = $('#journeybar');
  if (S.journey) {
    const j = S.journey, r = ROUTES[j.r];
    const f = clamp((S.t - j.dep) / (j.arr - j.dep), 0, 1);
    jb.hidden = false;
    $('#jbRoute').textContent = `${CITY[j.from].name} → ${CITY[j.to].name}`;
    $('#jbSub').textContent = `${r.name} · arrives ${when(j.arr)}`;
    $('#jbBar').style.width = `${(f * 100).toFixed(1)}%`;
  } else if (S.wait || S.resting) {
    jb.hidden = false;
    if (S.wait) {
      const r = ROUTES[S.wait.r];
      $('#jbRoute').textContent = `Waiting for the ${hm(S.wait.dep)} to ${CITY[S.wait.to].name}`;
      $('#jbSub').textContent = `${r.name} · ${span(S.wait.dep - S.t)} to departure`;
      $('#jbBar').style.width = '0%';
    } else {
      $('#jbRoute').textContent = `Asleep in ${CITY[S.city].name}`;
      $('#jbSub').textContent = `Until ${when(S.resting)}`;
      $('#jbBar').style.width = `${clamp(100 - (S.resting - S.t) / 4.8, 0, 100).toFixed(1)}%`;
    }
  } else jb.hidden = true;
}
let speed = 1;
$('#speedBtn').addEventListener('click', () => { speed = speed === 1 ? 3 : speed === 3 ? 8 : 1; $('#speedBtn').textContent = speed === 1 ? '» faster' : speed === 3 ? '»» fast' : '»»» fastest'; });
$('#dial').addEventListener('click', () => { if (!S.journey && !S.wait) openLedger('dossier'); });
$('#mission').addEventListener('click', () => { if (!S.journey && !S.wait) openLedger('dossier'); });
$('#dossierBtn').addEventListener('click', () => { if (!S.journey && !S.wait) openLedger('dossier'); else toast('Not while travelling.'); });
$('#caseBtn').addEventListener('click', () => { if (!S.journey && !S.wait) openLedger('case'); else toast('Your case is in the rack.'); });

// =============================================================== cards and toasts
const veil = $('#veil'), card = $('#card');
const isCardOpen = () => !veil.hidden;
function showCard(o) {
  paused = true;
  card.className = `card${o.danger ? ' danger' : ''}${o.titleCard ? ' title-card' : ''}`;
  card.innerHTML = `<div class="kick">${esc(o.kick || '')}</div>${o.titleCard ? `<h1>${esc(o.title)}</h1><div class="rule"></div>` : `<h2>${esc(o.title)}</h2>`}${(o.body || []).map((p) => `<p>${p}</p>`).join('')}<div class="choices">${o.choices.map((c, i) => `<button class="choice" data-i="${i}" ${c.disabled ? 'disabled' : ''}><b>${esc(c.label)}</b>${c.sub ? `<span>${esc(c.sub)}</span>` : ''}</button>`).join('')}</div>`;
  veil.hidden = false;
  card.querySelectorAll('.choice').forEach((b) => b.addEventListener('click', () => {
    const c = o.choices[+b.dataset.i];
    const result = c.run();
    if (S && S.ended) return;
    if (result) {
      card.querySelector('.choices').innerHTML = `<p class="result">${esc(result)}</p><button class="choice" id="cont"><b>Continue</b></button>`;
      $('#cont').addEventListener('click', closeCard);
      $('#cont').focus();
    } else closeCard();
  }));
  card.querySelector('.choice:not(:disabled)')?.focus();
}
function closeCard() {
  veil.hidden = true; paused = false;
  if (S && !S.ended && checkDeadline()) return;
  if (S && !S.journey && !S.wait && !S.resting && !S.ended) openLedger(ledgerView.name === 'city' || !ledgerOpen() ? 'city' : ledgerView.name, ledgerView.arg);
  save(); render();
}
function toast(text, bad) {
  const el = document.createElement('div'); el.className = `toast${bad ? ' bad' : ''}`; el.textContent = text;
  const box = $('#toasts'); box.appendChild(el);
  while (box.children.length > 3) box.firstChild.remove();
  setTimeout(() => el.remove(), 5200);
}

// =============================================================== the clock
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (S && !paused && !S.ended) {
    if (S.journey) {
      const rate = clamp((S.journey.arr - S.journey.dep) / 7, 40, 420) * speed; // the whole trip in about seven seconds
      runTo(S.t + rate * dt);
    } else if (S.wait) runTo(S.t + 150 * speed * dt);
    else if (S.resting) {
      const tgt = Math.min(S.resting, S.t + 240 * speed * dt);
      runTo(tgt);
      if (!paused && S.t >= S.resting) { S.resting = null; S.nerve = clamp(S.nerve + 35, 0, 100); S.visitStart = S.t; openLedger('city'); toast(`You wake refreshed, ${when(S.t)}.`); save(); }
    }
  }
  aim();
  draw();
  if (S) { renderHud(); renderJourneyBar(); }
  requestAnimationFrame(loop);
}
function render() { if (S) { lastHud = ''; renderHud(); renderJourneyBar(); if (ledgerOpen()) renderLedger(); } }

// =============================================================== start
function intro() {
  showCard({ kick: 'Europe, spring 1914', title: 'Shadow Express', titleCard: true, body: [
    'You carry things for the Bureau: letters, keys, plates, names. Each order gives a city and a deadline. Miss three and London will disown you.',
    'Three foreign agents hunt you across the continent. You will not see them move. You will hear of them: a question asked at a station, a name in a frontier register, a report wired from London. Every hotel, every passport check and every telegram may tell them where you were.',
    'Drag the globe to turn it. Tap your city for its departures, its hotels and its market.',
  ], choices: [{ label: 'Take the first order', run: () => null }] });
}
function startFresh() {
  newGame((Date.now() ^ 0x5eed) >>> 0);
  paused = false;
  ledgerView = { name: 'city', arg: null };
  view.follow = true;
  render();
  setTimeout(intro, 0);
}
function boot(data) {
  resize();
  const saved = data?.state ?? (() => { try { return JSON.parse(store.get('shadow-express') || 'null'); } catch { return null; } })();
  if (saved && saved.v === 3 && !saved.ended) {
    S = saved; paused = false; render();
    if (!S.journey && !S.wait && !S.resting) openLedger('city');
    toast(`Resumed: ${when(S.t)}, ${S.journey ? 'travelling' : CITY[S.city].name}.`);
  } else startFresh();
  requestAnimationFrame(loop);
}
window.addEventListener('resize', resize);
window.addEventListener('pagehide', save);
setInterval(save, 15000);
if (window.claude?.hot?.snapshot) window.claude.hot.snapshot(() => ({ state: S }));
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
// for tests
window.__shadow = { get S() { return S; }, set S(v) { S = v; }, runTo, book, CITY, ROUTES, earliest, setSpeed: (v) => { speed = v; } };
})();
</script>
